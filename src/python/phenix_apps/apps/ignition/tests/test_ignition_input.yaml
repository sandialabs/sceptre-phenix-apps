spec:
  experimentName: test-ignition
  baseDir: /tmp/test-ignition
  scenario:
    apps:
      - name: ignition
        hosts:
          - hostname: OT-scada
            metadata:
              type: gateway
              perspective: true
              api:
                auth: true
                require_https: true
                roles: [Operator]
              # Requires Historian Core, SQL Historian, and PostgreSQL JDBC.
              # Existing DB: gateway-restricted passwordless access, CONNECT,
              # schema USAGE/CREATE, and ownership of history tables/sequences.
              historian:
                ip: 10.68.30.200
                port: 5432
                user: ignition
                database: ignition_history
              connected_rtus:
                - ieee13-1-rtu
                - hostname: ieee13-2-rtu
                  name: farm-controller
                  destination_address: 1023
                  polling:
                    integrity: 60000
              polling:
                class1: 1000
          - hostname: hmi-1
            metadata:
              type: perspective
      # ieee13-1-rtu is an ot-sim fep, so its points get ot-sim names;
      # ieee13-2-rtu is not, so its points are discovered on the gateway
      - name: ot-sim
        hosts:
          - hostname: ieee13-1-rtu
            metadata:
              type: fep
              upstream:
                - cap1-ied
                - 671692-ied
          - hostname: cap1-ied
            metadata:
              type: fd-server
              dnp3:
                - name: cap1
                  type: capacitor
          - hostname: 671692-ied
            metadata:
              type: fd-server
              dnp3:
                interface: eth0:20010
                devices:
                  - name: '671692'
                    type: breaker
  topology:
    nodes:
      - type: VirtualMachine
        general:
          hostname: OT-scada
        hardware:
          drives:
            - image: OT-scada.qc2
          os_type: windows
        network:
          interfaces:
            - name: eth0
              vlan: OT
              address: 10.68.30.190
              mask: 24
      - type: VirtualMachine
        general:
          hostname: ieee13-1-rtu
        network:
          interfaces:
            - name: eth0
              vlan: OT
              address: 10.68.30.201
              mask: 24
      - type: VirtualMachine
        general:
          hostname: hmi-1
        hardware:
          drives:
            - image: hmi.qc2
          os_type: windows
        network:
          interfaces:
            - name: eth0
              vlan: OT
              address: 10.68.30.191
              mask: 24
      - type: VirtualMachine
        general:
          hostname: ieee13-2-rtu
        network:
          interfaces:
            - name: eth0
              vlan: OT
              address: 10.68.30.202
              mask: 24
      - type: VirtualMachine
        general:
          hostname: cap1-ied
        network:
          interfaces:
            - name: eth0
              vlan: OT
              address: 10.68.30.211
              mask: 24
      - type: VirtualMachine
        general:
          hostname: 671692-ied
        network:
          interfaces:
            - name: eth0
              vlan: OT
              address: 10.68.30.212
              mask: 24
