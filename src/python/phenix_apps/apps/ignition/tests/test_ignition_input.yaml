spec:
  experimentName: test-ignition
  baseDir: /tmp/test-ignition
  scenario:
    apps:
      - name: ignition
        hosts:
          - hostname: OT-scada
            metadata:
              type: gateway
              perspective: true
              api:
                auth: true
                require_https: true
                roles: [Operator]
              # Requires Historian Core, SQL Historian, and PostgreSQL JDBC.
              # Existing DB: gateway-restricted passwordless access, CONNECT,
              # schema USAGE/CREATE, and ownership of history tables/sequences.
              historian:
                ip: 192.168.10.200
                port: 5432
                user: ignition
                database: ignition_history
              connected_rtus:
                - rtu-1
                - hostname: rtu-2
                  name: farm-controller
                  destination_address: 1023
                  polling:
                    integrity: 60000
              polling:
                class1: 1000
                class2: 2000
                class3: 3000
          - hostname: hmi-1
            metadata:
              type: perspective
              connected_gateway: OT-scada
          # same metadata on a Linux gateway; the OS comes from the node's hardware.os_type
          - hostname: scada
            metadata:
              type: gateway
              perspective: true
              api: true
              connected_rtus:
                - rtu-1
      # rtu-1 is an ot-sim fep, so its points get ot-sim names;
      # rtu-2 is not, so its points are discovered on the gateway
      - name: ot-sim
        hosts:
          - hostname: rtu-1
            metadata:
              type: fep
              upstream:
                - capacitor1
                - breaker1
          - hostname: capacitor1
            metadata:
              type: fd-server
              dnp3:
                - name: capacitor1
                  type: capacitor
          - hostname: breaker1
            metadata:
              type: fd-server
              dnp3:
                interface: eth0:20010
                devices:
                  - name: breaker1
                    type: breaker
  topology:
    nodes:
      - type: VirtualMachine
        general:
          hostname: OT-scada
        hardware:
          drives:
            - image: ignition.qc2
          os_type: windows
        network:
          interfaces:
            - name: eth0
              vlan: SCADA
              address: 192.168.10.190
              mask: 24
      - type: VirtualMachine
        general:
          hostname: scada
        hardware:
          drives:
            - image: ignition-linux.qc2
          os_type: linux
        network:
          interfaces:
            - name: eth0
              vlan: SCADA
              address: 192.168.10.192
              mask: 24
      - type: VirtualMachine
        general:
          hostname: rtu-1
        network:
          interfaces:
            - name: eth0
              vlan: SCADA
              address: 192.168.10.201
              mask: 24
      - type: VirtualMachine
        general:
          hostname: hmi-1
        hardware:
          drives:
            - image: hmi.qc2
          os_type: windows
        network:
          interfaces:
            - name: eth0
              vlan: SCADA
              address: 192.168.10.191
              mask: 24
      - type: VirtualMachine
        general:
          hostname: rtu-2
        network:
          interfaces:
            - name: eth0
              vlan: SCADA
              address: 192.168.10.202
              mask: 24
      - type: VirtualMachine
        general:
          hostname: capacitor1
        network:
          interfaces:
            - name: eth0
              vlan: SCADA
              address: 192.168.10.211
              mask: 24
      - type: VirtualMachine
        general:
          hostname: breaker1
        network:
          interfaces:
            - name: eth0
              vlan: SCADA
              address: 192.168.10.212
              mask: 24
