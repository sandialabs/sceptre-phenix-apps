name: Repository Dispatch

on:
  push:
    branches: [main]

# The dispatch authenticates with REPO_DISPATCH_PAT, not GITHUB_TOKEN.
permissions: {}

jobs:
  dispatch:
    name: Dispatch to phenix
    # Forks have no REPO_DISPATCH_PAT, so the dispatch can only fail there.
    if: github.repository_owner == 'sandialabs'
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.REPO_DISPATCH_PAT }}
          repository: ${{ github.repository_owner }}/sceptre-phenix
          event-type: apps-update
          client-payload: '{"repo": "${{ github.repository }}", "ref": "${{ github.ref }}"}'
